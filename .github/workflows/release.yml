name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g. v0.0.3)'
        required: false
        default: 'v0.0.3'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Validate release tag and application versions
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:REF_NAME }
          $tagVersion = $tag -replace '^v', ''

          $tauri = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $cargoText = Get-Content 'src-tauri/Cargo.toml' -Raw
          if ($cargoText -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw 'Unable to read the Rust package version from src-tauri/Cargo.toml.'
          }
          $cargoVersion = $Matches[1]
          $versions = @([string]$tauri.version, [string]$package.version, [string]$cargoVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version mismatch: tauri=$($tauri.version), npm=$($package.version), cargo=$cargoVersion."
          }
          if ($tagVersion -ne [string]$tauri.version) {
            throw "Release tag '$tag' does not match application version '$($tauri.version)'. Update all package versions or use tag v$($tauri.version)."
          }
          Write-Host "Validated release tag $tag against Tauri, npm and Cargo version $tagVersion."

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm can omit platform-specific optional dependencies from a lockfile.
      # Install every Windows-native frontend binding explicitly.
      - name: Install Windows native frontend bindings
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps `
            @typescript/typescript-win32-x64@7.0.2 `
            @rolldown/binding-win32-x64-msvc@1.2.14 `
            @tailwindcss/oxide-win32-x64-msvc@4.3.3 `
            lightningcss-win32-x64-msvc@1.33.0 `
            lightningcss-win32-x64-msvc-v132@npm:lightningcss-win32-x64-msvc@1.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep Tailwind's pinned LightningCSS 1.32.0 at its expected nested path.
      - name: Ensure Tailwind LightningCSS package is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tailwindNode = Join-Path $PWD 'node_modules/@tailwindcss/node'
          if (-not (Test-Path -LiteralPath $tailwindNode)) {
            throw "Tailwind Node package directory is missing: $tailwindNode"
          }

          npm install --prefix $tailwindNode --no-save --package-lock=false --legacy-peer-deps lightningcss@1.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tailwindLightningCssPackage = Join-Path $tailwindNode 'node_modules/lightningcss/package.json'
          if (-not (Test-Path -LiteralPath $tailwindLightningCssPackage)) {
            throw "Could not install Tailwind's LightningCSS package: $tailwindLightningCssPackage"
          }

      # LightningCSS loads its version-specific binary beside its own package.
      - name: Place version-matched LightningCSS binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binding133 = Join-Path $PWD 'node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node'
          $binding132 = Join-Path $PWD 'node_modules/lightningcss-win32-x64-msvc-v132/lightningcss.win32-x64-msvc.node'
          $viteLightningCss = Join-Path $PWD 'node_modules/lightningcss/lightningcss.win32-x64-msvc.node'
          $tailwindLightningCss = Join-Path $PWD 'node_modules/@tailwindcss/node/node_modules/lightningcss/lightningcss.win32-x64-msvc.node'

          foreach ($file in @($binding133, $binding132)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Required LightningCSS native binding is missing: $file"
            }
          }

          foreach ($directory in @((Split-Path -Parent $viteLightningCss), (Split-Path -Parent $tailwindLightningCss))) {
            if (-not (Test-Path -LiteralPath $directory)) {
              throw "Required LightningCSS package directory is missing: $directory"
            }
          }

          Copy-Item -LiteralPath $binding133 -Destination $viteLightningCss -Force
          Copy-Item -LiteralPath $binding132 -Destination $tailwindLightningCss -Force
          Write-Host 'Installed LightningCSS 1.33.0 and 1.32.0 native bindings.'

      - name: Run TypeScript verification
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend distribution
        run: npm run build

      - name: Build Windows release bundle (NSIS, MSI & Standalone)
        run: cargo tauri build
        working-directory: .

      - name: Stage release artifacts & compute checksums
        id: stage_artifacts
        shell: bash
        run: |
          mkdir -p ./dist-release
          echo "Searching for generated Windows release artifacts..."
          find src-tauri/target/release -maxdepth 3 -type f \( -name "*.exe" -o -name "*.msi" \)

          # Copy installers and standalone binary
          cp -v src-tauri/target/release/netscope-x.exe ./dist-release/netscope-x-standalone.exe || true
          cp -v src-tauri/target/release/bundle/nsis/*.exe ./dist-release/ || true
          cp -v src-tauri/target/release/bundle/msi/*.msi ./dist-release/ || true

          ARTIFACT_COUNT=$(ls -1 ./dist-release/ | wc -l)
          echo "Found $ARTIFACT_COUNT artifacts in ./dist-release/"

          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No release artifacts found! Build failed or produced no packages."
            exit 1
          fi

          # Generate SHA256 checksum file
          cd ./dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Determine tag name
        id: tag_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: NetScope X ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*
          body: |
            ## NetScope X — Windows Network Intelligence Suite

            ### Included Packages (x64)
            - **NSIS Setup Installer**: `.exe` (recommended for Windows 10 & 11)
            - **Windows Installer Package**: `.msi` (enterprise / silent deployment)
            - **Standalone Portable Binary**: `netscope-x-standalone.exe`
            - **Checksum Verification**: `SHA256SUMS.txt`

            ### Runtime & Permissions Requirements
            - **OS**: Windows 10 (1809+) or Windows 11, x64
            - **Kernel Telemetry**: To record real-time per-application bandwidth attribution via Event Tracing for Windows (ETW), run NetScope X as **Administrator** or add your user account to the **Performance Log Users** group.
