name: Release

on:
  # Manual release only. A pushed tag never publishes without explicit approval.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Exact semantic-version tag to publish after approval."
        required: true
        type: string
      release_approved:
        description: "Explicitly approve creating and publishing the requested release."
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Validate owner approval and versions
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag_name }}
          RELEASE_APPROVED: ${{ github.event.inputs.release_approved }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_APPROVED -ne 'true') {
            throw 'Release blocked: explicit owner approval was not provided. No release tag will be created.'
          }
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'A release tag is required after approval.'
          }
          if ($tag -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+\z') {
            throw "Invalid release tag '$tag'. Expected a semantic-version tag such as v1.2.3."
          }
          $tagVersion = $tag -replace '^v', ''
          $tauri = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $lock = Get-Content 'package-lock.json' -Raw | ConvertFrom-Json
          $cargoText = Get-Content 'src-tauri/Cargo.toml' -Raw
          if ($cargoText -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw 'Unable to read the Rust package version from src-tauri/Cargo.toml.'
          }
          $cargoVersion = $Matches[1]
          $lockRootVersion = [string]$lock.packages[''].version
          $versions = @(
            [string]$tauri.version,
            [string]$package.version,
            [string]$lock.version,
            $lockRootVersion,
            [string]$cargoVersion
          ) | Select-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version mismatch: tauri=$($tauri.version), npm=$($package.version), lock=$($lock.version), cargo=$cargoVersion."
          }
          if ($tagVersion -ne [string]$tauri.version) {
            throw "Release tag '$tag' does not match application version '$($tauri.version)'."
          }
          Write-Host "Approved release tag $tag matches every application version file."

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Windows native frontend bindings
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps `
            @typescript/typescript-win32-x64@7.0.2 `
            @rolldown/binding-win32-x64-msvc@1.2.14 `
            @tailwindcss/oxide-win32-x64-msvc@4.3.3 `
            lightningcss-win32-x64-msvc@1.33.0 `
            lightningcss-win32-x64-msvc-v132@npm:lightningcss-win32-x64-msvc@1.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Tailwind LightningCSS package is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tailwindNode = Join-Path $PWD 'node_modules/@tailwindcss/node'
          if (-not (Test-Path -LiteralPath $tailwindNode)) {
            throw "Tailwind Node package directory is missing: $tailwindNode"
          }
          npm install --prefix $tailwindNode --no-save --package-lock=false --legacy-peer-deps lightningcss@1.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tailwindPackage = Join-Path $tailwindNode 'node_modules/lightningcss/package.json'
          if (-not (Test-Path -LiteralPath $tailwindPackage)) {
            throw "Could not install Tailwind's LightningCSS package: $tailwindPackage"
          }

      - name: Place version-matched LightningCSS native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binding133 = Join-Path $PWD 'node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node'
          $binding132 = Join-Path $PWD 'node_modules/lightningcss-win32-x64-msvc-v132/lightningcss.win32-x64-msvc.node'
          $viteLightningCss = Join-Path $PWD 'node_modules/lightningcss/lightningcss.win32-x64-msvc.node'
          $tailwindLightningCss = Join-Path $PWD 'node_modules/@tailwindcss/node/node_modules/lightningcss/lightningcss.win32-x64-msvc.node'
          foreach ($file in @($binding133, $binding132)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Required LightningCSS native binding is missing: $file"
            }
          }
          foreach ($directory in @((Split-Path -Parent $viteLightningCss), (Split-Path -Parent $tailwindLightningCss))) {
            if (-not (Test-Path -LiteralPath $directory)) {
              throw "Required LightningCSS package directory is missing: $directory"
            }
          }
          Copy-Item -LiteralPath $binding133 -Destination $viteLightningCss -Force
          Copy-Item -LiteralPath $binding132 -Destination $tailwindLightningCss -Force

      - name: Run TypeScript verification
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows release bundle
        run: cargo tauri build

      - name: Stage release artifacts and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'dist-release'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $standalone = Join-Path $PWD 'src-tauri/target/release/netscope-x.exe'
          if (Test-Path -LiteralPath $standalone) {
            Copy-Item -LiteralPath $standalone -Destination (Join-Path $output 'netscope-x-standalone.exe') -Force
          }
          foreach ($pattern in @('src-tauri/target/release/bundle/nsis/*.exe', 'src-tauri/target/release/bundle/msi/*.msi')) {
            Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $output -Force
            }
          }
          $packages = @(Get-ChildItem -LiteralPath $output -File)
          if ($packages.Count -eq 0) {
            throw 'No Windows release packages were generated.'
          }
          $checksums = foreach ($file in $packages) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Value $checksums -Encoding utf8

      - name: Publish approved GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NetScope X ${{ github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*
          body: |
            ## NetScope X — Windows Network Intelligence Suite

            Windows x64 packages built from the explicitly approved source commit.
            SHA256 checksums are included in `SHA256SUMS.txt`.
